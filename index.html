<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mùa Cà Phê Ea Kao 2D</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#1b0f0a;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center}
#hud{width:100%;max-width:420px;display:flex;justify-content:space-between;padding:10px 14px;background:#3e2723;font-weight:bold;font-size:15px;border-bottom:2px solid #ff9800}
canvas{width:100%;max-width:420px;height:420px;background:#87ceeb;display:block}
#btn{width:92%;max-width:390px;padding:16px;margin:12px 0;font-size:19px;font-weight:bold;background:linear-gradient(#ffb74d,#f57c00);color:#2e1a12;border:none;border-radius:14px;box-shadow:0 5px 0 #bf360c}
#btn:active{transform:translateY(4px);box-shadow:0 1px 0 #bf360c}
</style>
</head>
<body>
<div id="hud"><span id="m">MAP 1: HÁI CÀ</span><span id="t">⏱ 45s</span><span id="w">⚖️ 0kg xanh</span></div>
<canvas id="c" width="420" height="420"></canvas>
<button id="btn" onclick="act()">BẮT ĐẦU MÙA VỤ</button>
<script>
const cv=document.getElementById("c"),ctx=cv.getContext("2d"),btn=document.getElementById("btn");
let st=0,tm=45,wt=0,pg=0,cnt=0,itms="",pts="",iv,sp;
function ui(){document.getElementById("t").innerText="⏱ "+tm+"s";document.getElementById("w").innerText="⚖️ "+wt+"kg xanh";}
function addPt(x,y,txt,cl){pts+=(pts?"|":"")+x+","+y+","+txt+","+cl+",25";}
function act(){
  if(st===0){st=1;tm=45;wt=0;pg=0;cnt=0;itms="";pts="";btn.style.display="none";document.getElementById("m").innerText="MAP 1: HẤT CÀ XANH";
    iv=setInterval(()=>{tm--;ui();if(tm<=0)end(0);},1000);
    sp=setInterval(()=>{if(st!==1)return;cnt++;if(cnt>24){clearInterval(sp);setTimeout(()=>{st=2;pg=0;btn.style.display="block";btn.innerText="KÉO BẠT MẠNH LÊN!";document.getElementById("m").innerText="MAP 2: KÉO BẠT";},1200);return;}
      let g=Math.random()<0.65?1:0,x=Math.floor(Math.random()*340+40);
      itms+=(itms?"|":"")+x+",60,"+g;},500);
  }else if(st===2||st===3){
    let spk=Math.max(2.5,11-Math.floor(wt/4));pg+=spk;addPt(200,260,wt>15?"NẶNG QUÁ!":"KÉO!",wt>15?"#ff5252":"#69f0ae");
    if(pg>=100){pg=0;if(st===2){st=3;btn.innerText="VÁC BAO CHẠY NGAY!";document.getElementById("m").innerText="MAP 3: VÁC RA CÂN";}else end(1);}
  }
}
cv.addEventListener("pointerdown",e=>{
  if(st!==1)return;
  let r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)*(420/r.width),my=(e.clientY-r.top)*(420/r.height),nw="";
  itms.split("|").forEach(s=>{if(!s)return;let p=s.split(","),x=+p.at(0),y=+p.at(1),g=+p.at(2);
    if(Math.hypot(mx-x,my-y)<34){if(g===1)addPt(x,y,"HẤT HAY!","#69f0ae");else{wt+=2;ui();addPt(x,y,"RỚT CÀ CHÍN!","#ff5252");}}
    else nw+=(nw?"|":"")+s;
  });itms=nw;
});
function end(w){clearInterval(iv);clearInterval(sp);st=0;btn.style.display="block";btn.innerText="CHƠI LẠI MÙA MỚI";
  alert(w?"🎉 HOÀN THÀNH! Dư "+tm+"s. Lẫn "+wt+"kg cà xanh, ghé quán anh Hiếu Ea Kao cân tính giá đẹp nhé!":"😭 HẾT GIỜ! Để lẫn "+wt+"kg cà xanh nặng quá kéo không nổi!");
}
function loop(){
  ctx.clearRect(0,0,420,420);
  let sky=ctx.createLinearGradient(0,0,0,300);sky.addColorStop(0,"#4fc3f7");sky.addColorStop(1,"#e1f5fe");
  ctx.fillStyle=sky;ctx.fillRect(0,0,420,300);
  ctx.fillStyle="#6d4c41";ctx.fillRect(0,300,420,120);
  if(st===1){
    ctx.fillStyle="#2e7d32";ctx.beginPath();ctx.arc(210,10,230,0,Math.PI);ctx.fill();
    ctx.fillStyle="#1565c0";ctx.fillRect(20,355,380,25);
    let nw="";
    itms.split("|").forEach(s=>{if(!s)return;let p=s.split(","),x=+p.at(0),y=+p.at(1)+5.5,g=+p.at(2);
      ctx.fillStyle=g===1?"#7cb342":"#d32f2f";ctx.beginPath();ctx.ellipse(x,y,13,16,0.3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="rgba(255,255,255,0.4)";ctx.beginPath();ctx.arc(x-4,y-5,4,0,Math.PI*2);ctx.fill();
      if(y>355){if(g===1){wt+=3;ui();addPt(x,340,"+3kg XANH","#ff5252");}}else nw+=(nw?"|":"")+x+","+y+","+g;
    });itms=nw;
  }else if(st===2||st===3){
    let px=40+pg*2.8;
    ctx.fillStyle="#ff9800";ctx.fillRect(350,210,60,90);ctx.fillStyle="#fff";ctx.font="bold 10px sans-serif";ctx.fillText("CÂN HIẾU",354,235);ctx.fillText("EA KAO",360,250);
    ctx.fillStyle="#ffcc80";ctx.beginPath();ctx.arc(px,245,14,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#1976d2";ctx.fillRect(px-10,260,20,35);
    if(st===2){ctx.strokeStyle="#fff";ctx.beginPath();ctx.moveTo(px-10,280);ctx.lineTo(px-35,295);ctx.stroke();
      ctx.fillStyle="#1565c0";ctx.beginPath();ctx.ellipse(px-55,292,28,14+wt/3,0,0,Math.PI*2);ctx.fill();
    }else{ctx.fillStyle="#d7ccc8";ctx.beginPath();ctx.ellipse(px-5,235,16,22+wt/3,-0.4,0,Math.PI*2);ctx.fill();}
  }
  let np="";
  pts.split("|").forEach(s=>{if(!s)return;let p=s.split(","),x=+p.at(0),y=+p.at(1)-1.5,t=p.at(2),c=p.at(3),l=+p.at(4)-1;
    ctx.fillStyle=c;ctx.font="bold 15px sans-serif";ctx.fillText(t,x-25,y);
    if(l>0)np+=(np?"|":"")+x+","+y+","+t+","+c+","+l;
  });pts=np;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
